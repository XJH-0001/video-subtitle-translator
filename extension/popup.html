<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>视频实时字幕翻译</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2430;
        --muted: #6b7482;
        --line: #e3e7ee;
        --accent: #2f6fed;
        --accent-fg: #ffffff;
        --danger: #d93a3a;
        --card: #f6f8fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f27;
          --fg: #e8ecf3;
          --muted: #98a2b3;
          --line: #2c323d;
          --card: #232833;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 336px;
        margin: 0;
        padding: 14px 14px 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa3b0; flex: 0 0 auto; }
      .dot[data-s="running"] { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); }
      .dot[data-s="loading"] { background: #f5a623; animation: pulse 1.1s ease-in-out infinite; }
      .dot[data-s="error"] { background: var(--danger); }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

      .status { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 0 10px; min-height: 18px; }
      .status[data-tone="error"] { color: var(--danger); }
      .device { font-size: 11px; line-height: 1.5; margin: -6px 0 10px; padding: 4px 8px;
                border-radius: 6px; background: rgba(127,127,127,.12); color: var(--muted); }
      .device[data-kind="gpu"] { background: rgba(46,160,67,.16); color: #2ea043; font-weight: 600; }
      .device[data-kind="cpu"] { background: rgba(210,153,34,.14); color: #b8860b; }

      button.main {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      button.main:hover { filter: brightness(1.08); }
      button.main[data-on="1"] { background: var(--danger); }
      button.main:disabled { opacity: 0.55; cursor: default; }

      .row { display: flex; gap: 8px; margin-top: 8px; }
      .row > * { flex: 1; }
      button.ghost {
        padding: 7px 8px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.ghost:hover { background: var(--card); }
      button.ghost[data-on="1"] { border-color: var(--accent); color: var(--accent); }

      .card {
        margin-top: 11px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--card);
      }
      .card .label { color: var(--muted); font-size: 11px; margin-bottom: 6px; letter-spacing: 0.02em; }

      .preview-source { font-size: 12px; color: var(--muted); word-break: break-word; }
      .preview-target { font-size: 14px; font-weight: 600; margin-top: 3px; word-break: break-word; }
      .preview-empty { font-size: 12px; color: var(--muted); }

      label.field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
      label.field > span { flex: 1; }
      select, input[type="range"] { font-size: 12px; }
      select {
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        max-width: 150px;
      }
      input[type="range"] { width: 108px; }
      .checkline { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg); cursor: pointer; }
      .checkline input { margin: 0; }

      .divider { height: 1px; background: var(--line); margin: 10px 0 9px; }
      .foot { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.55; }
      .foot a { color: var(--accent); text-decoration: none; cursor: pointer; }
      code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot" data-s="idle"></span>视频实时字幕翻译</h1>
    <div class="status" id="status">正在获取状态…</div>
    <div class="device" id="device" hidden></div>

    <button class="main" id="toggle" disabled>开启实时字幕</button>

    <div class="row">
      <button class="ghost" id="editPos">调整位置</button>
      <button class="ghost" id="preview">预览效果</button>
      <button class="ghost" id="clear">清空</button>
    </div>

    <div class="card">
      <div class="label">最新字幕</div>
      <div id="preview-box"><div class="preview-empty">还没有字幕</div></div>
    </div>

    <div class="card">
      <div class="label">快捷设置</div>
      <label class="checkline" style="margin-bottom: 7px">
        <input type="checkbox" id="showSource" /> 显示原文（双语字幕）
      </label>
      <label class="field" style="margin-bottom: 7px">
        <span>字号</span>
        <input type="range" id="fontSize" min="14" max="44" step="1" />
        <b id="fontSizeVal" style="width: 26px; text-align: right">22</b>
      </label>
      <label class="field">
        <span>翻译成</span>
        <select id="targetLang"></select>
      </label>
      <label class="field" style="margin-top: 7px">
        <span>字幕位置</span>
        <select id="attachMode">
          <option value="auto">贴合视频画面</option>
          <option value="window">窗口底部</option>
        </select>
      </label>
      <label class="field" style="margin-top: 7px">
        <span>字幕速度</span>
        <select id="model">
          <option value="base">更快（base，延迟最低）</option>
          <option value="small">均衡（small，推荐）</option>
          <option value="medium">更准（medium，较慢）</option>
        </select>
      </label>
    </div>

    <div class="foot">
      服务地址 <code id="serverUrl">ws://127.0.0.1:8765/ws</code><br />
      <a id="openOptions">全部设置</a> ·
      <a id="openServer">打开本地服务状态页</a>
    </div>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
